name: Tests
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
jobs:
  browser-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: node tests/e2e/emulator.cjs
      - run: npm test
      - run: npm run test:e2e
      - run: npm run typecheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
